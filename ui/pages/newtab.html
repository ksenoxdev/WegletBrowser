<html>
  <head>
    <meta charset="utf-8" />
    <!-- Nothing loads from the network. This page has no reason to reach
         off the machine, and saying so here means a future mistake fails
         loudly instead of quietly phoning home. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; form-action 'none'; base-uri 'none'"
    />
    <title>New Tab</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="page">
      <h1 class="wordmark">Weglet</h1>
      <!-- The list is built by newtab.ts; a heading here keeps the region
           announced even while it is empty. -->
      <section aria-labelledby="dock-heading">
        <h2 id="dock-heading" class="visually-hidden">Pinned sites</h2>
        <div id="dock" class="dock"></div>
      </section>
    </main>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
