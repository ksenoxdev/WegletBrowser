     The blank-tab page. Structure only: the clock, the dock and the neon
     ring are driven by newtab.ts.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>New Tab</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="modal.css" />
    <link rel="stylesheet" href="newtab.css" />
  </head>
  <body>
    <main class="hero">
      <!-- Placeholder, not an empty node: the first paint happens before the
           script runs, and a collapsing element would shift the layout. -->
      <div class="clock" id="clock" aria-live="off">--:--</div>

      <div class="search-wrap">
        <!-- A div, not a form: a form would submit and reload the page.
             Enter is handled in newtab.ts. -->
        <div class="search-form" id="search-form">
          <input
            class="search-bar"
            id="search-bar"
            type="text"
            placeholder="Search or enter address"
            data-i18n-placeholder="newtab.searchPlaceholder"
            autocomplete="off"
            spellcheck="false"
            aria-label="Search or enter address"
            autofocus
          />
          <span class="engine-mark" id="engine-mark" aria-hidden="true"></span>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <section class="dock-wrap" aria-labelledby="dock-heading">
        <h2 id="dock-heading" class="visually-hidden">Pinned sites</h2>
        <div class="dock">
          <div class="dock-row" id="dock"></div>
        </div>
      </section>
    </main>

    <div class="context-menu" id="shortcut-menu" role="menu">
      <div class="context-menu-item" id="menu-edit" role="menuitem" tabindex="-1" data-i18n="newtab.contextEdit">
        Edit
      </div>
      <div
        class="context-menu-item danger"
        id="menu-delete"
        role="menuitem"
        tabindex="-1"
        data-i18n="newtab.contextDelete"
      >
        Delete
      </div>
    </div>

    <div class="modal-backdrop" id="shortcut-backdrop">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title" data-i18n="newtab.addShortcutTitle">Add shortcut</h2>
        <label>
          <span data-i18n="newtab.nameLabel">Name</span>
          <input id="shortcut-name" type="text" placeholder="My Site" data-i18n-placeholder="newtab.namePlaceholder" autocomplete="off" />
        </label>
        <label>
          <span data-i18n="newtab.linkLabel">Link</span>
          <input id="shortcut-url" type="text" placeholder="example.com" autocomplete="off" />
        </label>
        <div class="modal-actions">
          <button type="button" class="modal-btn cancel" id="shortcut-cancel" data-i18n="newtab.cancel">
            Cancel
          </button>
          <button type="button" class="modal-btn confirm" id="shortcut-confirm" data-i18n="newtab.add">
            Add
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="newtab.js"></script>
  </body>
</html>
