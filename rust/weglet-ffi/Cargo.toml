[package]
name = "weglet-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
publish.workspace = true

[lib]
name = "weglet_ffi"
# Static, not cdylib: GN links this straight into weglet.exe, so there is
# no second file to ship, sign or keep in step with the binary.
#
# The rlib alongside it is for tests/boundary.rs, which declares the entry
# points in an `extern "C"` block exactly as weglet_ffi.h does and links
# against them -- so a signature that drifts from the header fails to link
# in `cargo test` rather than becoming undefined behaviour in the browser.
# Nothing ships it; build_rust.py copies the staticlib and ignores this.
crate-type = ["staticlib", "rlib"]

[dependencies]
weglet-core = { path = "../weglet-core" }
weglet-url = { path = "../weglet-url" }
weglet-profile = { path = "../weglet-profile" }
weglet-security = { path = "../weglet-security" }

[lints.rust]
# The whole point of this crate. Every block carries a SAFETY comment.
unsafe_code = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
