name: CI

# Everything here runs without a Chromium checkout. The C++ side and
# weglet_unittests need a full build and are not covered -- see
# CONTRIBUTING.md.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust (test + clippy)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # boundary.rs binds every extern "C" function by its declared
      # signature, so a mismatch with weglet_ffi.h fails to compile here
      # rather than in the browser process.
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

  generators:
    name: Contract/token generators
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python3 ui/generators_test.py

  ui:
    name: protocol.ts validation + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # run_ui_tests.py wants Chromium's vendored node under
      # third_party/node/. There is no checkout here, so this fakes that
      # layout with the runner's system node.
      - name: Fake the vendored-toolchain layout
        run: |
          mkdir -p fake-chromium/third_party/node/linux/node-linux-x64/bin
          ln -s "$(command -v node)" fake-chromium/third_party/node/linux/node-linux-x64/bin/node
          npm install --global typescript
          mkdir -p fake-chromium/third_party/node/node_modules
          # The whole package, not just lib/tsc.js: newer TypeScript
          # versions have tsc.js import from its own package.json (the
          # "#getExePath" subpath import), which only resolves when that
          # package.json is there alongside it.
          cp -r "$(npm root -g)/typescript" \
             fake-chromium/third_party/node/node_modules/typescript

      - run: python3 ui/run_ui_tests.py --chromium-root fake-chromium

      - name: tsc --noEmit
        working-directory: ui
        run: tsc --project tsconfig.json --noEmit
